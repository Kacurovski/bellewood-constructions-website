<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bellewood Constructions — heritage renovations in inner Brisbane</title>
    <meta
      name="description"
      content="Renovations and extensions to heritage and older homes in inner Brisbane, built predominantly in timber. Around four projects a year."
    />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#05432a" />

    <!-- Open Graph and Twitter cards: what a pasted link shows in Messenger,
         WhatsApp, LinkedIn and the rest. The image is public/og.png, 1200x630,
         built from the reverse lockup on Bellewood Green. It is an absolute URL
         because share crawlers do not resolve relative ones; if the domain ever
         changes, change it here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bellewood Constructions" />
    <meta property="og:url" content="https://bellewood.com.au/" />
    <meta
      property="og:title"
      content="Bellewood Constructions — heritage renovations in inner Brisbane"
    />
    <meta
      property="og:description"
      content="Renovations and extensions to heritage and older homes in inner Brisbane, built predominantly in timber."
    />
    <meta property="og:image" content="https://bellewood.com.au/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bellewood Constructions — renovations and extensions to heritage homes in inner Brisbane" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bellewood Constructions — heritage renovations in inner Brisbane" />
    <meta name="twitter:description" content="Renovations and extensions to heritage and older homes in inner Brisbane, built predominantly in timber." />
    <meta name="twitter:image" content="https://bellewood.com.au/og.png" />

    <!-- The brand ground is painted before any CSS arrives, so the first frame
         is never white. -->
    <style>
      html { background: #f7f7f4; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
